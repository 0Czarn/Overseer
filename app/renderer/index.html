<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HOI4 Debugger</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body data-ready="0" data-loading="1">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">H4</span>
        <span class="brand-text">HOI4 Debugger</span>
      </div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div id="game-pill" class="pill pill-muted" title="Game detection">Starting backend…</div>
        <div id="game-meta" class="topbar-meta"></div>
        <div class="topbar-actions">
          <label class="switch" title="Keep this window above the game (local only)">
            <input type="checkbox" id="toggle-ontop"><span>On top</span>
          </label>
          <label class="switch" title="Denser layout (local only)">
            <input type="checkbox" id="toggle-compact"><span>Compact</span>
          </label>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
